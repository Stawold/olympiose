<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#24443d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Olympi'Ose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fff;--tx:#1c2b27;--mu:#68756f;--bd:#e3dfd3;--tq:#366158;--tqd:#24443d;--tql:#5a9486;--or:#DC7E25;--ye:#FFD966;--gy:#797979;--ac:var(--or);--ac2:var(--ye);--ok:#2f8f5b;--bad:#cf4b3f;--inp:#fff;--h3:#366158;--rk:rgba(54,97,88,.07);--sh:0 2px 8px rgba(36,68,61,.10)}
[data-theme=dark]{--bg:#0e1916;--card:#16251f;--tx:#eef3ef;--mu:#9bb0a8;--bd:#2a403a;--inp:#0f1c18;--ok:#4fc58a;--bad:#ff7a6e;--h3:#FFD966;--rk:rgba(150,185,172,.10);--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:500 16px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:0 12px}
/* en-tête */
.hd{position:relative;background:linear-gradient(135deg,var(--tqd),var(--tq));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 30px;margin-bottom:6px}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:18px;background:var(--bg);clip-path:polygon(0 100%,100% 0,100% 100%)}
.hi{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lg{height:52px;width:auto;flex:none}
.tt{flex:1;min-width:0}
.tt b{display:block;font:800 19px/1.1 Montserrat,Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.tt b i{font:400 20px/1 "Homemade Apple",cursive;letter-spacing:0;text-transform:none;color:var(--ye);margin-left:2px}
.tt small{display:block;color:rgba(255,255,255,.82);font-weight:600;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{position:absolute;left:14px;bottom:20px;display:flex;gap:5px}
.pills i{width:22px;height:5px;border-radius:3px;background:var(--or)}.pills i:nth-child(2){background:var(--ye)}.pills i:nth-child(3){background:var(--tql)}
.ic{display:flex;gap:6px}
.ic button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
.ic button:disabled{opacity:.3}
/* titres */
h2{font:800 20px/1.2 Montserrat,Poppins,sans-serif;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 10px}
h2::after{content:"";display:block;width:20px;height:5px;margin-top:8px;border-radius:3px;background:var(--or);box-shadow:26px 0 var(--ye),52px 0 var(--tql)}
h3{font:700 12.5px Montserrat,Poppins,sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--h3);margin:18px 0 6px}
small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.card.acc{border-left:6px solid var(--or)}
.center{text-align:center}.big{font-size:44px}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
input,select,textarea{width:100%;min-height:50px;font:inherit;font-weight:600;font-size:16px;color:var(--tx);background:var(--inp);border:2px solid var(--bd);border-radius:12px;padding:8px 12px}
textarea{min-height:88px;resize:vertical}
input[type=checkbox]{width:28px;min-height:28px;height:28px;accent-color:var(--or)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(220,126,37,.25)}
/* boutons */
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:800 14px Montserrat,Poppins,sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
.btn.pri{background:var(--or);border-color:var(--or);color:#1d1708}
.btn.gold{background:var(--ye);border-color:var(--ye);color:#2b2208}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:42px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.4;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}.grow small{display:block}
.row select{width:100px;flex:none}
.row input[type=number]{width:108px;flex:none}
.pts{min-width:64px;text-align:right;font:800 15px Montserrat,sans-serif;color:var(--ok)}
td .dot{margin-right:8px}
.dot{display:inline-block;vertical-align:middle;width:20px;height:20px;border-radius:50%;flex:none;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
/* barres basses */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);z-index:5}
.bar .btn{flex:1}
.bar.tabs{background:var(--tqd);border-top:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;max-width:none}
.tab{flex:1;background:none;border:0;color:rgba(255,255,255,.62);font:700 10px Montserrat,Poppins,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:5px 0 4px;min-height:54px;border-radius:12px;cursor:pointer;position:relative}
.tab span{display:block;font-size:22px;line-height:1.15}
.tab.on{color:var(--ye);background:rgba(255,255,255,.1)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--or)}
.dots{display:flex;gap:6px;margin:12px 0}.dots i{flex:1;height:7px;border-radius:4px;background:var(--bd)}.dots i.ok{background:var(--tql)}.dots i.on{background:var(--or)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:10px 0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.opt.on{border-color:var(--or);background:rgba(220,126,37,.10)}
.opt b{display:block;font:800 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em}.opt small{display:block;margin-top:2px}
.sw{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sw button.on{border-color:var(--tx);transform:scale(1.12)}
.stp{display:flex;align-items:center;gap:14px;margin:8px 0}
.stp b{font:800 30px Montserrat,sans-serif;min-width:40px;text-align:center}
.stp .btn{width:54px;padding:0;font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:none}
.chip{flex:none;padding:10px 15px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:700 12px Montserrat,Poppins,sans-serif;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;transform:skewX(-6deg)}
.chip.done{background:rgba(47,143,91,.14);border-color:var(--ok)}
.chip.cur{background:var(--tq);color:#fff;border-color:var(--tq);box-shadow:0 3px 0 var(--or)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bd);font:700 11px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.badge.ok{background:rgba(47,143,91,.16);color:var(--ok)}.badge.live{background:var(--or);color:#1d1708}.badge.gold{background:var(--ye);color:#2b2208}
.bar2{display:flex;gap:10px;margin:12px 0}.bar2 .btn{flex:1}
.warn{border-left:5px solid var(--ye);background:rgba(255,217,102,.18);padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
.err{border-left-color:var(--bad);background:rgba(207,75,63,.12)}
/* classements */
.rk{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;margin:7px 0;background:var(--rk);border-left:6px solid var(--bd);border-radius:12px}
.rk .n{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px;font:800 19px Montserrat,sans-serif;background:var(--tq);color:#fff;transform:skewX(-8deg)}
.rk.t1 .n{background:linear-gradient(135deg,var(--ye),var(--or));color:#2a1a05}
.rk.t2 .n{background:linear-gradient(135deg,#d3d9d6,#8c9591);color:#1f2523}
.rk.t3 .n{background:linear-gradient(135deg,#e6ae72,#b3672a);color:#2b1606}
.rk .nm{flex:1;font-weight:700;min-width:0;word-break:break-word}.rk .nm i{color:var(--mu);font-size:12px;font-weight:500;font-style:normal;display:block}
.rk b{font:800 22px Montserrat,sans-serif}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0;min-height:210px}
.pd{flex:1;max-width:180px;text-align:center}
.pd .nm{font:800 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;word-break:break-word}
.pd .bl{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:36px}
.pd.p1 .bl{height:142px;background:linear-gradient(180deg,var(--ye),var(--or))}
.pd.p2 .bl{height:100px;background:linear-gradient(180deg,#d3d9d6,#8c9591)}
.pd.p3 .bl{height:74px;background:linear-gradient(180deg,#e6ae72,#b3672a)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 7px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--tq);color:#fff;font:700 11px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th:first-child{background:var(--tq)}
td b{font:800 15px Montserrat,sans-serif}
.mt{display:flex;align-items:stretch;gap:6px;margin:9px 0}
.mt .sd{flex:1;border:2px solid var(--bd);border-radius:14px;padding:10px;font:700 15px Poppins,sans-serif;background:var(--card);color:var(--tx);text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;word-break:break-word;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.mt .sd.win{border-color:var(--ok);background:rgba(47,143,91,.16)}
.mt .sd.lose{opacity:.5}
.mt .sd.empty{font-weight:500;font-style:italic;color:var(--mu);cursor:default;box-shadow:none}
.mt .vs{align-self:center;color:var(--or);font:800 12px Montserrat,sans-serif}
.sc{display:flex;gap:8px;margin:2px 0 8px}.sc input{text-align:center;min-height:44px}
details{margin:10px 0}summary{cursor:pointer;font:700 13px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:6px 0;min-height:38px}
/* chrono */
.tm{font:800 90px/1 Montserrat,sans-serif;text-align:center;font-variant-numeric:tabular-nums;color:var(--ye);background:var(--tqd);border-radius:20px;padding:26px 0;margin:8px 0}
.tm.warn2{color:#fff;background:var(--bad);animation:pul 1s infinite}
@keyframes pul{50%{opacity:.7}}
.pr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pr .btn{min-width:72px}
.lnk{font-size:13px;word-break:break-all}
.mdl{position:fixed;inset:0;background:rgba(10,25,21,.6);display:grid;place-items:center;z-index:50;padding:20px}
.mb{background:var(--card);border-radius:18px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mb p{margin:0 0 6px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tqd);color:#fff;padding:11px 18px;border-radius:12px;z-index:20;font-weight:600;font-size:14px;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media(min-width:700px){.tab{font-size:11px}.lg{height:60px}}
</style>
</head>

const hdr=(sub,right='')=>`<header class="hd"><div class="hi"><img class="lg" src="${LOGO}" alt="Ose"><div class="tt"><b>Olympi'<i>Ose</i></b><small>${sub}</small></div>${right}</div><div class="pills"><i></i><i></i><i></i></div></header>`;
const KEY='olympiose.v1';
let PLAYER=location.hash.startsWith('#v='),PS=null;

function newTeam(i){return{id:uid(),name:'Équipe '+(i+1),color:COLORS[i%12],captain:'',players:''}}
function newEvent(i,n){return{id:uid(),name:'Épreuve '+(i+1),type:'rank',coef:1,bareme:BAREME.slice(0,n),rule:'',res:{}}}
function newState(){
  const teams=[0,1,2,3].map(newTeam);
  return{v:1,name:'',phase:'setup',started:false,mode:'single',teams,events:[0,1,2].map(i=>newEvent(i,4)),
    bonuses:[],pools:{n:2,q:2,assign:{}},bracket:{slots:[],petite:false,names:{},res:{}},cur:0,hide:false,baseUrl:''};
}
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
function save(){if(PLAYER)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=PLAYER?null:(load()||newState());
const UI={tab:'jeu',wiz:0,bt:'gen',after:'',open:false,prog:false};
const hist=[],redo=[];
let TH='light';
try{TH=localStorage.getItem('olympiose.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
document.documentElement.dataset.theme=TH;

function mutate(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();redo.length=0;fn();save();render()}
function undo(){if(!hist.length)return;redo.push(JSON.stringify(S));S=JSON.parse(hist.pop());save();render()}
function redoAct(){if(!redo.length)return;hist.push(JSON.stringify(S));S=JSON.parse(redo.pop());save();render()}
function ask(msg,ok='Confirmer'){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='mdl';
    d.innerHTML=`<div class="mb"><p>${esc(msg)}</p><div class="bar2"><button class="btn" data-ask="no">Annuler</button><button class="btn pri" data-ask="ok">${esc(ok)}</button></div></div>`;
    d.addEventListener('click',e=>{const b=e.target.closest('[data-ask]');if(b||e.target===d){d.remove();res(!!b&&b.dataset.ask==='ok')}});
    document.body.appendChild(d);
  });
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Copié ✅')}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copié ✅')}catch(_){toast('Copie impossible')}a.remove()}}
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]=/^\d+$/.test(k[i+1])?[]:{};o=o[k[i]]}o[k[k.length-1]]=val}

/* ========== Modèle ========== */
const teamName=id=>(S.teams.find(t=>t.id===id)||{}).name||'?';
const poolNames=()=>Array.from({length:S.pools.n},(_,i)=>String.fromCharCode(65+i));
const poolOf=id=>S.mode==='pools'?(S.pools.assign[id]??0):0;
function poolSizes(){const c=Array(S.pools.n).fill(0);S.teams.forEach(t=>{const p=S.pools.assign[t.id]??0;if(c[p]!=null)c[p]++});return c}
const rankSize=()=>S.mode==='pools'?Math.max(1,...poolSizes()):S.teams.length;
function fixPools(){
  S.pools.n=clamp(S.pools.n,2,Math.min(4,Math.max(2,S.teams.length)));
  const ids=new Set(S.teams.map(t=>t.id));
  Object.keys(S.pools.assign).forEach(k=>{if(!ids.has(k))delete S.pools.assign[k]});
  S.teams.forEach((t,i)=>{const a=S.pools.assign[t.id];if(a==null||a>=S.pools.n)S.pools.assign[t.id]=i%S.pools.n});
  const mn=Math.min(...poolSizes());S.pools.q=clamp(S.pools.q,1,Math.max(1,Math.min(4,mn)));
}
function syncBareme(){const n=rankSize();S.events.forEach(e=>{while(e.bareme.length<n)e.bareme.push(BAREME[e.bareme.length]??0);e.bareme.length=n})}
function blankMatchRes(){S.bracket.res={}}

function evPts(ev){
  const o={};
  S.teams.forEach(t=>{const v=ev.res[t.id];if(blank(v)){o[t.id]=null;return}
    const x=+v;o[t.id]=(ev.type==='rank'?(ev.bareme[x-1]??0):x)*(ev.coef||1)});
  return o;
}
const evComplete=ev=>S.teams.every(t=>!blank(ev.res[t.id]));
function bonusOf(id){return S.bonuses.filter(b=>b.tid===id).reduce((a,b)=>a+(+b.pts||0),0)}
function totalsMap(){
  const m={};S.teams.forEach(t=>m[t.id]=bonusOf(t.id));
  S.events.forEach(ev=>{const p=evPts(ev);S.teams.forEach(t=>m[t.id]+=p[t.id]||0)});return m;
}
function rankIds(ids,tot){
  const s=[...ids].sort((a,b)=>tot[b]-tot[a]);let r=1;
  return s.map((id,i)=>{if(i>0&&tot[s[i-1]]!==tot[id])r=i+1;return{id,rank:r,total:tot[id]}});
}
function poolRanks(){const tot=totalsMap();return poolNames().map((_,p)=>rankIds(S.teams.filter(t=>poolOf(t.id)===p).map(t=>t.id),tot))}
const poolDone=()=>S.events.length>0&&S.events.every(evComplete);

/* ---- tableau ---- */
const nextPow2=n=>{let p=2;while(p<n)p*=2;return p};
function seedOrder(size){let o=[1];while(o.length<size){const n=o.length*2;o=o.flatMap(x=>[x,n+1-x])}return o}
function refList(){
  if(S.mode==='knockout')return S.teams.map(t=>'T:'+t.id);
  const out=[];for(let rk=1;rk<=S.pools.q;rk++)for(let p=0;p<S.pools.n;p++)out.push(`Q:${p}:${rk}`);return out;
}
function refLabel(r){
  if(r==='BYE')return '— Exempt —';
  if(r.startsWith('T:'))return teamName(r.slice(2));
  const[,p,rk]=r.split(':');return `${ord(+rk)} poule ${String.fromCharCode(65+ +p)}`;
}
function genSlots(rand){
  let refs=refList();if(rand&&S.mode==='knockout')refs=shuffle(refs);
  const size=nextPow2(refs.length),o=seedOrder(size),sl=[];
  for(let i=0;i<size;i+=2){const g=k=>refs[o[k]-1]||'BYE';sl.push([g(i),g(i+1)])}
  S.bracket.slots=sl;blankMatchRes();
}
function ensureSlots(force){
  if(S.mode==='single')return;
  const rl=refList(),fl=S.bracket.slots.flat();
  const valid=fl.length&&fl.every(r=>r==='BYE'||rl.includes(r))&&rl.every(r=>fl.includes(r));
  if(force||!valid)genSlots(false);
}
function bracketIssues(){
  if(S.mode==='single')return[];
  const out=[],used={},rl=refList(),fl=S.bracket.slots.flat();
  fl.forEach(r=>{if(r!=='BYE')used[r]=(used[r]||0)+1;if(r!=='BYE'&&!rl.includes(r))out.push('Emplacement invalide')});
  Object.entries(used).forEach(([r,c])=>{if(c>1)out.push(refLabel(r)+' est placé plusieurs fois')});
  rl.forEach(r=>{if(!used[r])out.push(refLabel(r)+" n'est pas dans le tableau")});
  S.bracket.slots.forEach((m,i)=>{if(m[0]==='BYE'&&m[1]==='BYE')out.push('Match '+(i+1)+' : deux exempts')});
  return out;
}
const nR=()=>S.bracket.slots.length?Math.log2(S.bracket.slots.length)+1:0;
const roundLabel=(r,R)=>{const k=R-1-r;return k===0?'Finale':k===1?'Demi-finales':k===2?'Quarts de finale':k===3?'Huitièmes de finale':'Tour '+(r+1)};
const petiteOn=()=>S.mode!=='single'&&S.bracket.petite&&nR()>=2;

function buildBracket(){
  if(S.mode==='single'||!S.bracket.slots.length)return null;
  const br=S.bracket,R=nR(),pr=S.mode==='pools'?poolRanks():null,ready=S.mode!=='pools'||poolDone();
  const resolve=ref=>{
    if(ref==='BYE')return'BYE';if(ref.startsWith('T:'))return ref.slice(2);
    if(!ready)return null;const[,p,rk]=ref.split(':');const x=pr[+p]&&pr[+p][+rk-1];return x?x.id:null};
  const rounds=[];
  const mk=(key,a,b,al,bl)=>{
    const r=br.res[key]||{};const bye=a==='BYE'||b==='BYE';let win=null;
    if(bye){const o=a==='BYE'?b:a;win=o==='BYE'?null:o}else if(r.w&&(r.w===a||r.w===b))win=r.w;
    return{key,a,b,al,bl,bye,win,sa:r.sa??'',sb:r.sb??''};
  };
  for(let r=0;r<R;r++){
    const cnt=br.slots.length>>r,ms=[];
    for(let m=0;m<cnt;m++){
      if(r===0){const[x,y]=br.slots[m];ms.push(mk('0-'+m,resolve(x),resolve(y),refLabel(x),refLabel(y)))}
      else{const p=rounds[r-1].matches;ms.push(mk(r+'-'+m,p[2*m].win,p[2*m+1].win,'Vainqueur match '+(2*m+1),'Vainqueur match '+(2*m+2)))}
    }
    rounds.push({l:roundLabel(r,R),g:br.names[r]||'',matches:ms});
  }
  let petite=null;
  if(petiteOn()){
    const sm=rounds[R-2].matches;
    const lo=m=>m.bye||!m.win?null:(m.a===m.win?m.b:m.a);
    petite=mk('P',lo(sm[0]),lo(sm[1]),'Perdant demi 1','Perdant demi 2');
    petite.bye=false;petite.win=(br.res.P&&br.res.P.w&&(br.res.P.w===petite.a||br.res.P.w===petite.b))?br.res.P.w:null;
    petite.g=br.names.P||'';
  }
  return{rounds,petite};
}
function poolTies(){
  if(S.mode!=='pools'||!poolDone())return[];
  const out=[];poolRanks().forEach((rows,p)=>{const q=S.pools.q;
    if(rows.length>q&&rows[q-1].rank===rows[q].rank)out.push('Poule '+String.fromCharCode(65+p))});
  return out;
}

/* ---- étapes live ---- */
function steps(){
  const out=[];
  if(S.mode!=='knockout')S.events.forEach((e,i)=>out.push({k:'e',i,l:e.name}));
  if(S.mode!=='single'&&S.bracket.slots.length){
    const R=nR();
    for(let r=0;r<R;r++){
      if(r===R-1&&petiteOn())out.push({k:'p',l:'Petite finale'});
      const g=S.bracket.names[r];out.push({k:'r',r,l:roundLabel(r,R)+(g?' – '+g:'')});
    }
  }
  return out;
}

/* ---- instantané pour les joueurs ---- */
function snapshot(){
  const T=S.teams,idx=Object.fromEntries(T.map((t,i)=>[t.id,i]));
  const st=steps(),cur=S.phase==='done'?-1:S.cur;
  const status=si=>S.phase==='done'?'done':si<cur?'done':si===cur?'live':'todo';
  const e=S.events.map((ev,i)=>{
    const pts=evPts(ev),si=st.findIndex(x=>x.k==='e'&&x.i===i);
    return{n:ev.name,c:ev.coef,t:ev.type,g:ev.rule,st:status(si),p:T.map(t=>pts[t.id]),r:T.map(t=>blank(ev.res[t.id])?null:+ev.res[t.id])};
  });
  const ix=id=>id==='BYE'?-1:id==null?null:idx[id];
  const mm=m=>({a:ix(m.a),b:ix(m.b),w:m.win==null?null:idx[m.win],sa:m.sa,sb:m.sb,al:m.al,bl:m.bl,bye:m.bye});
  const b=buildBracket();
  return{n:S.name,ts:Date.now(),ph:S.phase,hide:S.hide,m:S.mode,
    t:T.map(t=>[t.name,t.color,t.captain,lines(t.players)]),e,b:T.map(t=>bonusOf(t.id)),
    pl:T.map(t=>poolOf(t.id)),pn:S.mode==='pools'?poolNames():[],q:S.pools.q,
    cl:S.phase==='done'?'Terminée':(st[S.cur]?st[S.cur].l:''),
    br:b?{rounds:b.rounds.map(r=>({l:r.l,g:r.g,m:r.matches.map(mm)})),petite:b.petite?Object.assign(mm(b.petite),{g:b.petite.g}):null}:null};
}

/* ========== Calculs sur instantané (animateur ET joueurs) ========== */
function totalsOf(s,k){
  const K=k==null?s.e.length:k;
  return s.t.map((_,i)=>s.e.slice(0,K).reduce((a,e)=>a+(e.p[i]||0),0)+(k==null||k>=s.e.length?s.b[i]:0));
}
function standings(s){
  const n=s.t.length,tot=totalsOf(s),key=Array(n).fill(-1),tag=Array(n).fill('');
  let inBr=false,prov=false;
  if(s.br){
    const R=s.br.rounds.length,reach=Array(n).fill(-1);
    s.br.rounds.forEach((rd,r)=>rd.m.forEach(m=>[m.a,m.b].forEach(x=>{if(x!=null&&x>=0){inBr=true;reach[x]=Math.max(reach[x],r)}})));
    for(let i=0;i<n;i++)if(reach[i]>=0){key[i]=100+reach[i];tag[i]='En lice'}
    s.br.rounds.forEach((rd,r)=>rd.m.forEach(m=>{
      const real=m.a!=null&&m.b!=null&&m.a>=0&&m.b>=0;
      if(m.w!=null&&m.w>=0){
        const lo=real?(m.a===m.w?m.b:m.a):-1;
        if(lo>=0){key[lo]=r;tag[lo]='Éliminé · '+rd.l}
        if(r===R-1){key[m.w]=1000;tag[m.w]='🏆 Vainqueur';if(lo>=0){key[lo]=R-1;tag[lo]='🥈 Finaliste'}}
      }else if(real)prov=true;
    }));
    const p=s.br.petite;
    if(p&&p.a!=null&&p.b!=null&&p.a>=0&&p.b>=0){
      if(p.w!=null&&p.w>=0){key[p.w]=R-1.5;tag[p.w]='🥉 3e';const lo=p.a===p.w?p.b:p.a;key[lo]=R-2;tag[lo]='4e'}else prov=true;
    }
  }
  const idx=[...Array(n).keys()].sort((x,y)=>key[y]-key[x]||((key[x]<0&&key[y]<0)?tot[y]-tot[x]:0));
  const rows=[];let rk=1;
  idx.forEach((i,j)=>{
    if(j>0){const p=idx[j-1];const same=key[p]===key[i]&&(key[i]>=0||tot[p]===tot[i]);if(!same)rk=j+1}
    rows.push({i,rank:rk,total:tot[i],tag:tag[i]});
  });
  rows.forEach((r,j)=>{r.tie=(rows[j-1]&&rows[j-1].rank===r.rank)||(rows[j+1]&&rows[j+1].rank===r.rank)});
  return{rows,inBr,prov};
}
const dot=c=>`<span class="dot" style="background:${esc(c)}"></span>`;
const sname=(s,i)=>`${dot(s.t[i][1])}${esc(s.t[i][0])}`;

function rankRows(s,ids,tot,showTag){
  const sorted=[...ids].sort((a,b)=>tot[b]-tot[a]);let r=1;
  return sorted.map((i,j)=>{if(j>0&&tot[sorted[j-1]]!==tot[i])r=j+1;
    const tie=(sorted[j-1]!==undefined&&tot[sorted[j-1]]===tot[i])||(sorted[j+1]!==undefined&&tot[sorted[j+1]]===tot[i]);
    return`<div class="rk ${r<4?'t'+r:''}" style="border-left-color:${esc(s.t[i][1])}"><span class="n">${r}</span><span class="nm">${esc(s.t[i][0])}${tie?'<i>ex æquo</i>':''}</span><b>${fmt(tot[i])}</b></div>`}).join('');
}
function podium(s,rows){
  const top=rows.slice(0,3);if(top.length<2)return'';
  const mk=(r,c,m)=>r?`<div class="pd ${c}"><div class="nm">${esc(s.t[r.i][0])}</div><div class="bl">${m}</div></div>`:'';
  return`<div class="podium">${mk(top[1],'p2','🥈')}${mk(top[0],'p1','🥇')}${mk(top[2],'p3','🥉')}</div>`;
}

/* ---- Rendu du classement (partagé) ---- */
function board(s,animator){
  const hasBr=!!s.br,hasEv=s.e.length>0;
  const tabs=[['gen','Général'],hasEv&&['ev','Épreuves'],hasBr&&['br','Tableau'],['eq','Équipes']].filter(Boolean);
  if(!tabs.find(t=>t[0]===UI.bt))UI.bt='gen';
  let h=`<div class="chips">${tabs.map(t=>`<button class="chip ${UI.bt===t[0]?'cur':''}" data-ui="bt" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  h+=UI.bt==='gen'?bGen(s):UI.bt==='ev'?bEv(s):UI.bt==='br'?bBr(s):bEq(s);
  return h;
}
function bGen(s){
  const done=s.ph==='done';
  if(s.hide&&!done)return`<div class="card center"><div class="big">🤫</div><b>Classement masqué jusqu'à la fin</b><p class="mu">Suspense ! ${esc(s.cl?'En cours : '+s.cl:'')}</p></div>`;
  let h='';
  const k=UI.after===''||UI.after==null?null:+UI.after;
  if(s.e.length&&s.m!=='knockout'){
    h+=`<select data-ui="after"><option value="">Classement actuel</option>${s.e.map((e,j)=>`<option value="${j+1}" ${k===j+1?'selected':''}>Après « ${esc(e.n)} »</option>`).join('')}</select>`;
  }
  const poolTables=(kk)=>{
    const tot=totalsOf(s,kk);
    return s.pn.map((nm,p)=>`<div class="card"><b>Poule ${nm}</b>${rankRows(s,s.t.map((_,i)=>i).filter(i=>s.pl[i]===p),tot)}</div>`).join('');
  };
  if(k!=null){
    h+=s.m==='pools'?poolTables(k):`<div class="card">${rankRows(s,s.t.map((_,i)=>i),totalsOf(s,k))}</div>`;
    return h;
  }
  const st=standings(s);
  if(s.m==='pools'&&!st.inBr)return h+poolTables(null);
  if(done)h+=podium(s,st.rows);
  h+=`<div class="card"><b>${done?'Classement final':'Classement'+(st.prov?' provisoire':'')}</b>`+st.rows.map(r=>
    `<div class="rk ${r.rank<4?'t'+r.rank:''}" style="border-left-color:${esc(s.t[r.i][1])}"><span class="n">${r.rank}</span><span class="nm">${esc(s.t[r.i][0])}${r.tie?'<i>ex æquo</i>':''}${r.tag?`<i>${esc(r.tag)}</i>`:''}</span>${s.m==='knockout'?'':`<b>${fmt(r.total)}</b>`}</div>`).join('')+'</div>';
  if(s.m==='pools')h+=`<h3>Phase de poules</h3>`+poolTables(null);
  return h;
}
function bEv(s){
  const st=standings(s),order=st.rows.map(r=>r.i),tot=totalsOf(s);
  const hasB=s.b.some(x=>x);
  let h=`<div class="card tw"><table><tr><th>Équipe</th>${s.e.map((e,j)=>`<th title="${esc(e.n)}">E${j+1}</th>`).join('')}${hasB?'<th>Bonus</th>':''}<th>Total</th></tr>`;
  order.forEach(i=>{h+=`<tr><td>${sname(s,i)}</td>${s.e.map(e=>`<td>${e.p[i]==null?'–':fmt(e.p[i])}</td>`).join('')}${hasB?`<td>${s.b[i]?fmt(s.b[i]):'–'}</td>`:''}<td><b>${fmt(tot[i])}</b></td></tr>`});
  h+='</table></div>';
  s.e.forEach((e,j)=>{
    const ids=s.t.map((_,i)=>i).filter(i=>e.p[i]!=null).sort((a,b)=>e.p[b]-e.p[a]);
    const none=s.t.map((_,i)=>i).filter(i=>e.p[i]==null);
    let r=1;
    h+=`<div class="card"><b>E${j+1} · ${esc(e.n)}</b> ${e.c&&e.c!==1?`<span class="badge gold">×${e.c}</span>`:''} <span class="badge ${e.st==='done'?'ok':e.st==='live'?'live':''}">${e.st==='done'?'Terminée':e.st==='live'?'En cours':'À venir'}</span>`;
    if(!ids.length)h+='<p class="mu">Pas encore de résultat.</p>';
    ids.forEach((i,x)=>{if(x>0&&e.p[ids[x-1]]!==e.p[i])r=x+1;
      const raw=e.t==='score'?` <small>(${fmt(e.r[i])})</small>`:'';
      h+=`<div class="rk ${r<4?'t'+r:''}" style="border-left-color:${esc(s.t[i][1])}"><span class="n">${r}</span><span class="nm">${esc(s.t[i][0])}${s.pn.length?`<i>Poule ${s.pn[s.pl[i]]}</i>`:''}</span><b>${fmt(e.p[i])}${raw?'':''}</b></div>`});
    if(none.length&&ids.length)h+=`<small class="mu">En attente : ${none.map(i=>esc(s.t[i][0])).join(', ')}</small>`;
    h+='</div>';
  });
  return h;
}
function bBr(s){
  const nm=(id,l)=>id==null?`<span class="mu"><i>${esc(l)}</i></span>`:id<0?'Exempt':sname(s,id);
  const card=(m,title)=>{
    const sc=(m.sa!==''||m.sb!=='')?`<small class="mu">${esc(m.sa)} – ${esc(m.sb)}</small>`:'';
    return`<div class="mt"><div class="sd ${m.w===m.a&&m.a!=null?'win':m.w!=null?'lose':''}">${nm(m.a,m.al)}</div><span class="vs">vs</span><div class="sd ${m.w===m.b&&m.b!=null?'win':m.w!=null?'lose':''}">${nm(m.b,m.bl)}</div></div>${sc}`};
  let h='';
  s.br.rounds.forEach((rd,r)=>{
    h+=`<div class="card"><b>${esc(rd.l)}</b>${rd.g?` <span class="badge">${esc(rd.g)}</span>`:''}${rd.m.map(m=>card(m)).join('')}</div>`;
    if(r===s.br.rounds.length-2&&s.br.petite)h+=`<div class="card"><b>Petite finale</b>${s.br.petite.g?` <span class="badge">${esc(s.br.petite.g)}</span>`:''}${card(s.br.petite)}</div>`;
  });
  return h;
}
function bEq(s){
  return s.t.map((t,i)=>`<div class="card"><b>${sname(s,i)}</b>${s.pn.length?` <span class="badge">Poule ${s.pn[s.pl[i]]}</span>`:''}${t[2]?`<div>🎖 Capitaine : ${esc(t[2])}</div>`:''}${t[3].length?`<div class="mu">${t[3].map(esc).join(' · ')}</div>`:''}</div>`).join('');

  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  const med={1:['#FFD966','#DC7E25','#2a1a05'],2:['#d3d9d6','#8c9591','#1f2523'],3:['#e6ae72','#b3672a','#2b1606']};

    rr(95,y+13,64,64,14);x.fill();

    x.textAlign='right';x.font='800 38px Montserrat,Poppins,system-ui,sans-serif';x.fillStyle='#FFD966';

/* ---- encodage du lien ---- */
function b64u(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function enc(o){
  const bytes=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream!=='undefined'){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();return'z'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}catch(e){}}
  return'j'+b64u(bytes);
}
async function dec(t){
  let u=ub64(t.slice(1));
  if(t[0]==='z'){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u);w.close();u=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(u));
}
function baseUrl(){return(S.baseUrl||'').trim()||(/^https?:/.test(location.protocol)?location.origin+location.pathname:'')}
async function makeLink(){const b=baseUrl();if(!b)return'';return b.replace(/#.*$/,'')+'#v='+await enc(snapshot())}
async function fillLink(){const el=$('#lnk');if(!el)return;const l=await makeLink();const e2=$('#lnk');if(e2){e2.value=l||'⚠️ Renseigne l’adresse de la page ci-dessous';const n=$('#llen');if(n)n.textContent=l?l.length+' caractères':''}}

const wizSteps=()=>S.mode==='single'?['general','teams','events','launch']:S.mode==='pools'?['general','teams','events','pools','launch']:['general','teams','bracket','launch'];
const stepper=(val,m,p)=>`<div class="stp"><button class="btn" data-act="${m}">−</button><b>${val}</b><button class="btn" data-act="${p}">+</button></div>`;
function wizard(){
  const ws=wizSteps();UI.wiz=clamp(UI.wiz,0,ws.length-1);const id=ws[UI.wiz];
  const body={general:wGeneral,teams:wTeams,events:wEvents,pools:wPools,bracket:wBracket,launch:wLaunch}[id]();
  return`${hdr('Création · étape '+(UI.wiz+1)+'/'+ws.length)}
  <div class="dots">${ws.map((x,i)=>`<i class="${i===UI.wiz?'on':i<UI.wiz?'ok':''}"></i>`).join('')}</div>
  <main>${body}</main>
  <div class="bar"><button class="btn" data-act="prev" ${UI.wiz?'':'disabled'}>◀ Retour</button>${id==='launch'?'<button class="btn pri" data-act="launch">🚀 Lancer</button>':'<button class="btn pri" data-act="next">Suivant ▶</button>'}</div>`;
}

  const o=(m,t,d)=>`<button class="opt ${S.mode===m?'on':''}" data-act="mode" data-v="${m}"><b>${t}</b><small>${d}</small></button>`;
  return`<h2>L'olympiade</h2><label>Nom de l'événement</label><input data-bind="name" value="${esc(S.name)}" placeholder="Ex : Olympiades du séminaire 2026">
  <h3>Type d'olympiade</h3>
  ${o('single','Poule unique','Toutes les équipes font toutes les épreuves. Les points s’additionnent : classement général.')}
  ${o('pools','Poules séparées + phase finale','Chaque poule joue ses épreuves, puis les qualifiés s’affrontent dans un tableau (demi-finales, finale…).')}
  ${o('knockout','Éliminatoires','Tableau direct : on perd, on sort. Chaque tour est un jeu.')}
  ${S.phase==='setup'&&S.started?'<div class="warn">Tu modifies une olympiade en cours : les résultats déjà saisis sont conservés.</div><button class="btn danger" style="width:100%" data-act="newolympiad">🗑 Repartir de zéro</button>':''}`;
}

  S.teams.forEach((t,i)=>{
    h+=`<div class="card"><div class="sw">${COLORS.map(c=>`<button style="background:${c}" class="${t.color===c?'on':''}" data-act="color" data-i="${i}" data-v="${c}" aria-label="couleur"></button>`).join('')}</div>
    <label>Nom de l'équipe</label><input data-bind="teams.${i}.name" value="${esc(t.name)}">
    <label>Capitaine (facultatif)</label><input data-bind="teams.${i}.captain" value="${esc(t.captain)}">
    <label>Joueurs (un par ligne, facultatif)</label><textarea data-bind="teams.${i}.players">${esc(t.players)}</textarea></div>`;
  });
  h+=`<details class="card"><summary>🎲 Tirage au sort des équipes</summary><label>Liste de tous les joueurs (un par ligne)</label><textarea id="allp" placeholder="Alice&#10;Bruno&#10;…"></textarea><button class="btn pri" style="width:100%;margin-top:8px" data-act="deal">Répartir au hasard dans les ${S.teams.length} équipes</button><small>Remplace les listes de joueurs actuelles.</small></details>`;

function wEvents(){
  let h=`<h2>Épreuves</h2>${stepper(S.events.length,'nev-','nev+')}`;
  if(S.mode==='pools')h+=`<div class="warn">En poules, le classement de chaque épreuve se fait <b>au sein de chaque poule</b>.</div>`;
  S.events.forEach((e,i)=>{
    h+=`<div class="card"><label>Épreuve ${i+1}</label><input data-bind="events.${i}.name" value="${esc(e.name)}">
    <label>Comment sont attribués les points ?</label>
    <div class="bar2"><button class="btn ${e.type==='rank'?'pri':''}" data-act="etype" data-i="${i}" data-v="rank">Selon la place</button><button class="btn ${e.type==='score'?'pri':''}" data-act="etype" data-i="${i}" data-v="score">Score saisi</button></div>
    ${e.type==='rank'?`<label>Barème (points par place)</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px">${e.bareme.map((b,j)=>`<div><small>${ord(j+1)}</small><input type="number" inputmode="decimal" data-num="1" data-bind="events.${i}.bareme.${j}" value="${b}"></div>`).join('')}</div>`:`<small>Le score obtenu par l'équipe = ses points (ex : 50 au tir à l'arc → 50 pts).</small>`}
    <label>Coefficient</label><select data-bind="events.${i}.coef" data-num="1">${[1,1.5,2,3].map(c=>`<option ${e.coef===c?'selected':''} value="${c}">×${c}${c===1?' (normal)':''}</option>`).join('')}</select>

function wPools(){
  const mn=Math.min(...poolSizes());
  let h=`<h2>Poules</h2><label>Nombre de poules</label>${stepper(S.pools.n,'npools-','npools+')}`;
  h+=`<div class="card">${S.teams.map(t=>`<div class="row">${dot(t.color)}<div class="grow"><b>${esc(t.name)}</b></div><select data-bind="pools.assign.${t.id}" data-num="1" data-pool="1">${poolNames().map((n,p)=>`<option value="${p}" ${poolOf(t.id)===p?'selected':''}>Poule ${n}</option>`).join('')}</select></div>`).join('')}</div>
  <button class="btn" style="width:100%" data-act="drawpools">🎲 Tirage au sort des poules</button>
  <label>Qualifiés par poule pour la phase finale</label>${stepper(S.pools.q,'nq-','nq+')}`;
  if(mn<S.pools.q)h+=`<div class="warn err">Une poule a moins d'équipes que de qualifiés.</div>`;
  return h+bracketEditor();
}
function wBracket(){return`<h2>Tableau</h2><p class="mu">Chaque tour est un jeu. Les équipes sans adversaire sont exemptes.</p>${bracketEditor()}`}
function bracketEditor(){
  if(!S.bracket.slots.length)ensureSlots(true);
  const R=nR(),opts=[...refList(),'BYE'];
  let h=`<h3>Tableau de la phase finale</h3><div class="card">`;
  S.bracket.slots.forEach((m,i)=>{
    h+=`<small>Match ${i+1}</small><div class="bar2">${[0,1].map(k=>`<select data-bind="bracket.slots.${i}.${k}" data-render="1">${opts.map(o=>`<option value="${esc(o)}" ${m[k]===o?'selected':''}>${esc(refLabel(o))}</option>`).join('')}</select>`).join('')}</div>`;
  });
  h+=`<div class="bar2">${S.mode==='knockout'?'<button class="btn" data-act="drawbr">🎲 Tirage au sort</button>':''}<button class="btn" data-act="resetbr">↺ Tableau automatique</button></div></div>`;
  const iss=bracketIssues();if(iss.length)h+=`<div class="warn err">${iss.map(esc).join('<br>')}</div>`;
  if(R>=2)h+=`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-bind="bracket.petite" data-render="1" ${S.bracket.petite?'checked':''}> Petite finale (match pour la 3e place)</label>`;
  h+=`<h3>Nom du jeu de chaque tour</h3>`;
  for(let r=0;r<R;r++)h+=`<label>${roundLabel(r,R)}</label><input data-bind="bracket.names.${r}" value="${esc(S.bracket.names[r]||'')}" placeholder="Ex : Tir à la corde">`;
  if(R>=2&&S.bracket.petite)h+=`<label>Petite finale</label><input data-bind="bracket.names.P" value="${esc(S.bracket.names.P||'')}">`;
  return h;
}
function problems(){
  const e=[];
  if(S.teams.length<2)e.push('Il faut au moins 2 équipes.');
  if(S.mode!=='knockout'&&!S.events.length)e.push('Ajoute au moins une épreuve.');
  if(S.mode==='pools'){const sz=poolSizes();sz.forEach((n,p)=>{if(n<1)e.push('La poule '+String.fromCharCode(65+p)+' est vide.');else if(n<S.pools.q)e.push('La poule '+String.fromCharCode(65+p)+' a moins d’équipes que de qualifiés.')})}
  if(S.mode!=='single')e.push(...bracketIssues());
  return e;
}
function wLaunch(){
  const pb=problems(),modes={single:'Poule unique',pools:'Poules + phase finale',knockout:'Éliminatoires'};
  let h=`<h2>Récapitulatif</h2><div class="card"><b>${esc(S.name||'Olympiade sans nom')}</b><div class="mu">${modes[S.mode]} · ${S.teams.length} équipes${S.mode!=='knockout'?' · '+S.events.length+' épreuves':''}</div></div>
  <div class="card">${S.teams.map(t=>`<div class="row">${dot(t.color)}<div class="grow"><b>${esc(t.name)}</b>${t.captain?`<small>🎖 ${esc(t.captain)}</small>`:''}</div>${S.mode==='pools'?`<span class="badge">Poule ${poolNames()[poolOf(t.id)]}</span>`:''}</div>`).join('')}</div>`;
  if(S.mode!=='knockout')h+=`<div class="card">${S.events.map((e,i)=>`<div class="row"><span class="badge">${i+1}</span><div class="grow"><b>${esc(e.name)}</b><small>${e.type==='rank'?'Barème : '+e.bareme.join(' / '):'Score = points'}${e.coef!==1?' · ×'+e.coef:''}</small></div></div>`).join('')}</div>`;
  if(pb.length)h+=`<div class="warn err"><b>À corriger avant de lancer :</b><br>${pb.map(esc).join('<br>')}</div>`;
  h+=`<p class="mu">Tout est sauvegardé automatiquement sur cet appareil.</p>`;
  return h;
}

/* ========== Mode animateur (live) ========== */
function live(){
  const st=steps();if(S.cur>=st.length)S.cur=Math.max(0,st.length-1);
  const tabs=[['jeu','🎯','Jeu'],['rank','🏆','Classement'],['chrono','⏱','Chrono'],['bonus','➕','Bonus'],['share','🔗','Partage']];
  const c={jeu:()=>jeuTab(st),rank:rankTab,chrono:chronoTab,bonus:bonusTab,share:shareTab}[UI.tab]();
  return`${hdr(esc(S.name||'Olympiade'),`<div class="ic"><button data-act="undo" ${hist.length?'':'disabled'} aria-label="Annuler">↶</button><button data-act="redo" ${redo.length?'':'disabled'} aria-label="Rétablir">↷</button></div>`)}<main>${c}</main>
  <nav class="bar tabs">${tabs.map(t=>`<button class="tab ${UI.tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
}
function jeuTab(st){
  const stat=i=>S.phase==='done'||i<S.cur?'done':i===S.cur?'cur':'';
  let h=`<div class="chips">${st.map((x,i)=>`<button class="chip ${stat(i)}" data-act="go" data-i="${i}">${esc(x.l)}</button>`).join('')}</div>`;
  if(S.phase==='done'){
    h+=`<div class="card center"><div class="big">🏁</div><b>Olympiade terminée</b><p class="mu">Le classement final est dans l'onglet Classement.</p><button class="btn" data-act="reopen">Rouvrir pour corriger</button><button class="btn pri" style="margin-top:10px;width:100%" data-act="newolympiad">🆕 Nouvelle olympiade</button></div>`;
  }else{
    const x=st[S.cur];
    h+=x.k==='e'?eventPanel(x.i):roundPanel(x);
    h+=`<div class="bar2"><button class="btn" data-act="prevstep" ${S.cur?'':'disabled'}>◀ Précédent</button><button class="btn ${S.cur===st.length-1?'gold':'pri'}" data-act="nextstep">${S.cur===st.length-1?'🏁 Terminer':'Suivant ▶'}</button></div>`;
  }
  h+=`<details class="card" data-keep="prog" ${UI.prog?'open':''}><summary>🗂 Programme &amp; ordre des épreuves</summary>`;
  const ev=S.events;
  ev.forEach((e,i)=>{const si=st.findIndex(x=>x.k==='e'&&x.i===i);const s=S.phase==='done'||si<S.cur?'ok':si===S.cur?'live':'';
    h+=`<div class="row"><span class="badge ${s}">${s==='ok'?'✓':s==='live'?'▶':'·'}</span><div class="grow"><b>${esc(e.name)}</b>${e.coef!==1?`<small>×${e.coef}</small>`:''}</div><button class="btn sm" data-act="mv" data-i="${i}" data-v="-1" ${i?'':'disabled'}>↑</button><button class="btn sm" data-act="mv" data-i="${i}" data-v="1" ${i<ev.length-1?'':'disabled'}>↓</button></div>`});
  st.filter(x=>x.k!=='e').forEach(x=>h+=`<div class="row"><span class="badge">·</span><div class="grow">${esc(x.l)}</div></div>`);
  return h+'</details>';
}
function eventPanel(i){
  const ev=S.events[i],pts=evPts(ev),done=S.teams.filter(t=>!blank(ev.res[t.id])).length;
  const groups=S.mode==='pools'?poolNames().map((n,p)=>({t:'Poule '+n,teams:S.teams.filter(t=>poolOf(t.id)===p)})):[{t:'',teams:S.teams}];
  let h=`<div class="card acc"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><small>Épreuve ${i+1}/${S.events.length}</small><h2 style="margin:0">${esc(ev.name)}</h2></div><div>${ev.coef!==1?`<span class="badge gold">×${ev.coef}</span> `:''}<span class="badge ${done===S.teams.length?'ok':'live'}">${done}/${S.teams.length}</span></div></div>`;
  if(ev.rule)h+=`<div class="warn">📋 ${esc(ev.rule).replace(/\n/g,'<br>')}</div>`;
  h+=ev.type==='rank'?`<small>Barème : ${ev.bareme.map((b,j)=>ord(j+1)+' → '+fmt(b*(ev.coef||1))).join(' · ')}</small>`:`<small>Score saisi = points${ev.coef!==1?' (×'+ev.coef+')':''}</small>`;
  groups.forEach(g=>{
    if(g.t)h+=`<h3>${g.t}</h3>`;
    g.teams.forEach(t=>{
      const v=ev.res[t.id],p=pts[t.id],max=Math.max(g.teams.length,blank(v)?0:+v);
      h+=`<div class="row">${dot(t.color)}<div class="grow"><b>${esc(t.name)}</b>${t.captain?`<small>🎖 ${esc(t.captain)}</small>`:''}</div>`;
      h+=ev.type==='rank'
        ?`<select data-bind="events.${i}.res.${t.id}" data-live="1" data-num="1"><option value="">—</option>${Array.from({length:max},(_,k)=>`<option value="${k+1}" ${+v===k+1&&!blank(v)?'selected':''}>${ord(k+1)}</option>`).join('')}</select>`
        :`<input type="number" inputmode="decimal" step="any" placeholder="score" data-bind="events.${i}.res.${t.id}" data-live="1" data-num="1" value="${blank(v)?'':v}">`;
      h+=`<span class="pts">${p==null?'':'+'+fmt(p)}</span></div>`;
    });
  });
  h+='</div>';
  h+=`<details class="card" data-keep="open" ${UI.open?'open':''}><summary>⚙️ Modifier cette épreuve</summary>
  <label>Nom</label><input data-bind="events.${i}.name" value="${esc(ev.name)}" data-render="1">
  <label>Points</label><select data-bind="events.${i}.type" data-render="1"><option value="rank" ${ev.type==='rank'?'selected':''}>Selon la place</option><option value="score" ${ev.type==='score'?'selected':''}>Score saisi</option></select>
  <label>Coefficient</label><select data-bind="events.${i}.coef" data-num="1" data-render="1">${[1,1.5,2,3].map(c=>`<option ${ev.coef===c?'selected':''} value="${c}">×${c}</option>`).join('')}</select>
  ${ev.type==='rank'?`<label>Barème</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px">${ev.bareme.map((b,j)=>`<div><small>${ord(j+1)}</small><input type="number" inputmode="decimal" data-num="1" data-bind="events.${i}.bareme.${j}" data-render="1" value="${b}"></div>`).join('')}</div>`:''}
  <label>Règle</label><textarea data-bind="events.${i}.rule" data-render="1">${esc(ev.rule)}</textarea></details>`;
  return h;
}
function roundPanel(x){
  const b=buildBracket(),m=x.k==='p'?[b.petite]:b.rounds[x.r].matches;
  const title=x.k==='p'?'Petite finale':b.rounds[x.r].l,nk=x.k==='p'?'P':x.r;
  let h=`<div class="card"><h2 style="margin:0 0 6px">${esc(title)}</h2>`;
  if(S.mode==='pools'&&!poolDone())h+=`<div class="warn">Les épreuves de poule ne sont pas toutes saisies : les qualifiés ne sont pas encore connus.</div>`;
  const ties=poolTies();if(ties.length&&x.k==='r'&&x.r===0)h+=`<div class="warn err">Égalité pour une place qualificative (${ties.join(', ')}). Départage possible avec un bonus (onglet ➕ Bonus).</div>`;
  h+=`<label>Jeu de ce tour (facultatif)</label><input data-bind="bracket.names.${nk}" value="${esc(S.bracket.names[nk]||'')}" data-render="1">`;
  m.forEach(mt=>{
    const side=(id,l,k)=>{
      if(id==='BYE')return`<div class="sd empty">Exempt</div>`;
      if(id==null)return`<div class="sd empty">${esc(l)}</div>`;
      const cls=mt.win===id?'win':mt.win?'lose':'';
      return`<button class="sd ${cls}" data-act="win" data-k="${mt.key}" data-v="${id}">${dot((S.teams.find(t=>t.id===id)||{}).color)}${esc(teamName(id))}${mt.win===id?' ✓':''}</button>`};
    h+=`<div class="mt">${side(mt.a,mt.al)}<span class="vs">vs</span>${side(mt.b,mt.bl)}</div>`;
    if(mt.bye)h+=`<small class="mu">Qualifié d'office.</small>`;
    else if(mt.a&&mt.b&&mt.a!=='BYE'&&mt.b!=='BYE')h+=`<div class="sc"><input type="number" inputmode="decimal" step="any" placeholder="score" data-live="1" data-bind="bracket.res.${mt.key}.sa" value="${esc(mt.sa)}"><input type="number" inputmode="decimal" step="any" placeholder="score" data-live="1" data-bind="bracket.res.${mt.key}.sb" value="${esc(mt.sb)}"></div>`;
  });
  return h+'<small class="mu">Touche l’équipe gagnante (touche encore pour annuler).</small></div>';
}

  const s=snapshot();

  <textarea id="lnk" class="lnk" readonly rows="4"></textarea><small id="llen" class="mu"></small>
  <div class="bar2"><button class="btn pri" data-act="copylink">Copier</button><button class="btn" data-act="sharenative">Partager…</button></div>
  <div class="bar2"><button class="btn" data-act="openlink">👀 Voir la page joueurs</button><button class="btn" data-act="shareimg">🖼 Image</button></div>
  ${noBase?'<div class="warn err">Cette page est ouverte depuis un fichier : indique ci-dessous l’adresse web où elle est hébergée.</div>':''}
  <label>Adresse de la page publique ${noBase?'':'(auto)'}</label><input data-bind="baseUrl" data-link="1" value="${esc(S.baseUrl)}" placeholder="https://monpseudo.github.io/olympiose/"></div>
  <div class="card"><b>Réglages</b><div class="bar2" style="margin-bottom:0"><button class="btn" data-act="theme">${TH==='dark'?'☀️ Mode clair':'🌙 Mode sombre'}</button><button class="btn" data-act="fs">⛶ Plein écran</button></div>
  <button class="btn" style="width:100%;margin-top:10px" data-act="backsetup">✏️ Modifier la configuration</button></div>
  <details class="card"><summary>💾 Sauvegarde de secours</summary><p class="mu">Copie ce texte et conserve-le (notes, message). Tu pourras le coller pour restaurer.</p><textarea id="imp" rows="4"></textarea>
  <div class="bar2"><button class="btn" data-act="export">Copier la sauvegarde</button><button class="btn" data-act="import">Restaurer</button></div></details>
  <button class="btn danger" style="width:100%" data-act="newolympiad">🗑 Nouvelle olympiade (efface l'actuelle)</button>`;
}

/* ---- Chrono ---- */
const TM={mode:'down',dur:180,acc:0,start:0,run:false,ctx:null};
const tmEl=()=>TM.acc+(TM.run?Date.now()-TM.start:0);
function tmShow(){
  const el=$('#tm');if(!el)return;
  const ms=TM.mode==='down'?Math.max(0,TM.dur*1000-tmEl()):tmEl();
  const sec=TM.mode==='down'?Math.ceil(ms/1000):Math.floor(ms/1000);
  el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  el.classList.toggle('warn2',TM.mode==='down'&&ms<=10000&&sec>0&&TM.run);
  if(TM.mode==='down'&&TM.run&&ms<=0){TM.acc=TM.dur*1000;TM.run=false;beep();if(UI.tab==='chrono'&&!PLAYER)render()}
}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([300,120,300,120,500])}catch(e){}
  try{const c=TM.ctx;if(!c)return;[0,.35,.7].forEach((d,k)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=k===2?1100:800;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.28);o.start(c.currentTime+d);o.stop(c.currentTime+d+.3)})}catch(e){}
}
function chronoTab(){
  const down=TM.mode==='down';
  return`<h2>Chrono</h2><div class="card"><div class="bar2"><button class="btn ${down?'pri':''}" data-act="tmode" data-v="down">Minuteur</button><button class="btn ${!down?'pri':''}" data-act="tmode" data-v="up">Chronomètre</button></div>
  <div class="tm" id="tm">00:00</div>
  ${down?`<div class="pr">${[[30,'30 s'],[60,'1 min'],[120,'2 min'],[180,'3 min'],[300,'5 min'],[600,'10 min']].map(p=>`<button class="btn sm ${TM.dur===p[0]?'pri':''}" data-act="tdur" data-v="${p[0]}">${p[1]}</button>`).join('')}</div><div class="pr"><button class="btn sm" data-act="tadj" data-v="-30">−30 s</button><button class="btn sm" data-act="tadj" data-v="30">+30 s</button></div>`:''}
  <div class="bar2"><button class="btn ${TM.run?'':'gold'}" data-act="tgo" style="min-height:64px;font-size:20px">${TM.run?'⏸ Pause':'▶ Démarrer'}</button><button class="btn" data-act="treset" style="min-height:64px">↺ Zéro</button></div></div>`;
}
setInterval(tmShow,200);

/* ========== Mode joueurs ========== */
function playerView(){
  if(!PS)return`${hdr('Classement en direct')}<div class="card center"><div class="big">😕</div><b>Lien illisible</b><p class="mu">Demande à l'animateur de te renvoyer le lien.</p></div>`;
  const s=PS,d=new Date(s.ts),hh=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const done=s.ph==='done';
  return`${hdr(esc(s.n||'Olympiade'),`<div class="ic"><button data-act="theme" aria-label="thème">${TH==='dark'?'☀️':'🌙'}</button><button data-act="fs" aria-label="plein écran">⛶</button></div>`)}
  <div class="card"><span class="badge ${done?'ok':'live'}">${done?'Terminée':'En cours'}</span> ${!done&&s.cl?`<b>${esc(s.cl)}</b>`:''}<br><small>Mis à jour à ${hh} · demande le dernier lien à l'animateur pour actualiser</small></div>
  <main>${board(s,false)}</main>
  <div class="bar"><button class="btn" data-act="shareimg">🖼 Partager en image</button></div>`;
}

/* ========== Rendu & événements ========== */
function render(){
  const y=window.scrollY,el=$('#app'),hd=$('#hdr');
  const h=PLAYER?playerView():S.phase==='setup'?wizard():live();
  const m=h.match(/^\s*<header class="hd">[\s\S]*?<\/header>/);
  hd.innerHTML=m?m[0]:'';el.innerHTML=m?h.slice(m[0].length):h;
  window.scrollTo(0,y);tmShow();
  if(!PLAYER&&S.phase!=='setup'&&UI.tab==='share')fillLink();
}
function val(el){
  if(el.type==='checkbox')return el.checked;
  if(el.dataset.num){const x=parseFloat(el.value);return isNaN(x)?'':x}
  return el.value;
}
document.addEventListener('input',e=>{
  const el=e.target;if(PLAYER||!el.dataset||!el.dataset.bind)return;
  if(el.dataset.live||el.dataset.render||el.type==='checkbox'||el.tagName==='SELECT')return;
  setPath(el.dataset.bind,val(el));save();if(el.dataset.link)fillLink();
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.ui){UI[el.dataset.ui]=el.value;render();return}
  if(PLAYER||!el.dataset.bind)return;
  if(el.dataset.live){mutate(()=>setPath(el.dataset.bind,val(el)));return}
  setPath(el.dataset.bind,val(el));
  if(el.dataset.pool){fixPools();ensureSlots(true)}
  save();if(el.dataset.render||el.type==='checkbox'||el.tagName==='SELECT')render();
});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.keep;if(k)UI[k]=e.target.open},true);

function go(i){S.cur=i}
document.addEventListener('click',async e=>{
  const u=e.target.closest('[data-ui]');
  if(u&&u.tagName==='BUTTON'){UI[u.dataset.ui]=u.dataset.v;render();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i,v=b.dataset.v;
  if(a==='theme'){TH=TH==='dark'?'light':'dark';document.documentElement.dataset.theme=TH;try{localStorage.setItem('olympiose.theme',TH)}catch(_){}return render()}
  if(a==='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){toast('Plein écran indisponible')}return}
  if(a==='shareimg')return shareImage(PLAYER?PS:snapshot());
  if(PLAYER)return;
  const T=S.teams;
  switch(a){
  /* assistant */
  case'mode':S.mode=v;fixPools();syncBareme();if(v!=='single')ensureSlots(true);save();return render();
  case'next':UI.wiz++;if(['pools','bracket'].includes(wizSteps()[UI.wiz])){fixPools();ensureSlots(false)}save();render();return scrollTo(0,0);
  case'prev':UI.wiz--;render();return scrollTo(0,0);
  case'nteams+':case'nteams-':{const n=clamp(T.length+(a.endsWith('+')?1:-1),2,12);while(T.length<n)T.push(newTeam(T.length));while(T.length>n)T.pop();fixPools();syncBareme();if(S.mode!=='single')ensureSlots(true);save();return render()}
  case'color':T[i].color=v;save();return render();
  case'deal':{const names=shuffle(lines($('#allp').value));if(!names.length)return toast('Colle d’abord la liste des joueurs');T.forEach(t=>t.players='');names.forEach((n,k)=>{const t=T[k%T.length];t.players+=(t.players?'\n':'')+n});save();toast(names.length+' joueurs répartis');return render()}
  case'nev+':case'nev-':{const n=clamp(S.events.length+(a.endsWith('+')?1:-1),1,12);while(S.events.length<n)S.events.push(newEvent(S.events.length,rankSize()));S.events.length=n;save();return render()}
  case'etype':S.events[i].type=v;save();return render();
  case'samebareme':S.events.forEach(e=>e.bareme=[...S.events[0].bareme]);save();toast('Barème copié');return render();
  case'npools+':case'npools-':S.pools.n=clamp(S.pools.n+(a.endsWith('+')?1:-1),2,Math.min(4,T.length));S.teams.forEach((t,k)=>S.pools.assign[t.id]=k%S.pools.n);fixPools();syncBareme();ensureSlots(true);save();return render();
  case'nq+':case'nq-':S.pools.q=S.pools.q+(a.endsWith('+')?1:-1);fixPools();ensureSlots(true);save();return render();
  case'drawpools':shuffle(T).forEach((t,k)=>S.pools.assign[t.id]=k%S.pools.n);fixPools();syncBareme();ensureSlots(true);save();return render();
  case'drawbr':genSlots(true);save();return render();
  case'resetbr':genSlots(false);save();return render();
  case'launch':{const pb=problems();if(pb.length){toast(pb[0]);return}
    syncBareme();if(!S.started){S.cur=0;S.started=true}S.phase='live';UI.tab='jeu';save();render();return scrollTo(0,0)}
  /* live */
  case'tab':UI.tab=v;render();return scrollTo(0,0);
  case'undo':return undo();
  case'redo':return redoAct();
  case'go':return mutate(()=>{go(i);S.phase='live'});
  case'prevstep':return mutate(()=>go(Math.max(0,S.cur-1)));
  case'nextstep':{const st=steps(),x=st[S.cur];
    if(x.k==='e'&&!evComplete(S.events[x.i])&&!(await ask('Il manque des résultats pour cette épreuve. Continuer quand même ?','Continuer')))return;
    if(S.cur>=st.length-1){if(!(await ask('Terminer l’olympiade et afficher le classement final ?','Terminer')))return;mutate(()=>{S.phase='done';UI.tab='rank';UI.bt='gen'});return scrollTo(0,0)}
    mutate(()=>go(S.cur+1));return scrollTo(0,0)}
  case'reopen':return mutate(()=>{S.phase='live';UI.tab='jeu'});
  case'mv':return mutate(()=>{const d=+v,j=i+d,ev=S.events;[ev[i],ev[j]]=[ev[j],ev[i]];if(S.cur===i)S.cur=j;else if(S.cur===j)S.cur=i});
  case'win':return mutate(()=>{const r=S.bracket.res[b.dataset.k]=S.bracket.res[b.dataset.k]||{};r.w=r.w===v?null:v});
  case'badd':{const tid=$('#bt').value,p=parseFloat($('#bp').value);if(isNaN(p)||!p)return toast('Indique un nombre de points');
    const l=$('#bl').value.trim();mutate(()=>S.bonuses.push({id:uid(),tid,pts:p,label:l}));return toast('Ajouté')}
  case'bdel':return mutate(()=>S.bonuses.splice(i,1));
  case'bq':{const f=$('#bp');f.value=+(+(f.value||0)+ +v).toFixed(2);return}
  case'copylink':{const l=await makeLink();if(!l)return toast('Renseigne l’adresse de la page (onglet Partage)');return copy(l)}
  case'sharenative':{const l=await makeLink();if(!l)return toast('Renseigne l’adresse de la page');
    try{await navigator.share({title:S.name||"Olympi'Ose",text:'Suis le classement en direct 🏆',url:l})}catch(err){if(!err||err.name!=='AbortError')copy(l)}return}
  case'openlink':{const l=await makeLink();if(l)window.open(l,'_blank');else toast('Renseigne l’adresse de la page');return}
  case'export':return copy(JSON.stringify(S));
  case'import':{const t=$('#imp').value.trim();if(!t)return toast('Colle la sauvegarde dans la zone');
    try{const o=JSON.parse(t);if(!o||!o.teams||!o.events)throw 0;if(!(await ask('Remplacer l’olympiade actuelle par cette sauvegarde ?','Restaurer')))return;mutate(()=>{S=o});toast('Restaurée')}catch(_){toast('Sauvegarde invalide')}return}
  case'backsetup':return mutate(()=>{S.phase='setup';UI.wiz=0});
  case'newolympiad':if(!(await ask('Effacer l’olympiade actuelle et repartir de zéro ? Cette action est définitive.','Effacer')))return;S=newState();UI.bt='gen';UI.after='';hist.length=0;redo.length=0;UI.wiz=0;UI.tab='jeu';save();return render();
  case'tmode':TM.mode=v;TM.acc=0;TM.run=false;return render();
  case'tdur':TM.dur=+v;TM.acc=0;TM.run=false;return render();
  case'tadj':TM.dur=Math.max(10,TM.dur+ +v);return render();
  case'tgo':if(TM.run){TM.acc=tmEl();TM.run=false}else{if(TM.mode==='down'&&tmEl()>=TM.dur*1000)TM.acc=0;TM.start=Date.now();TM.run=true;try{TM.ctx=TM.ctx||new(window.AudioContext||window.webkitAudioContext)();TM.ctx.resume&&TM.ctx.resume()}catch(_){}}return render();
  case'treset':TM.acc=0;TM.run=false;TM.start=Date.now();return render();
  }
});
window.addEventListener('hashchange',()=>location.reload());

async function init(){
  if(PLAYER){try{PS=await dec(location.hash.slice(3))}catch(e){PS=null}}
  else{try{S.teams&&S.events&&S.mode}catch(e){S=newState()}if(!S.pools)S.pools={n:2,q:2,assign:{}};if(!S.bracket)S.bracket={slots:[],petite:false,names:{},res:{}};fixPools();syncBareme()}
  render();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
</body>
